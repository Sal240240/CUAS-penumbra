name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python core (physics, DSP, tracking, reasoning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,hardware]"
      - name: Test
        run: pytest -q

  hardware:
    name: Hardware generators produce their fabrication files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[hardware]"
      - name: Regenerate every fabrication output
        run: |
          python hardware/antennas/logperiodic.py uhf
          python hardware/antennas/logperiodic.py cellular
          python hardware/antennas/patch_array.py
          python hardware/mech/enclosure.py
          python hardware/mech/mount_bracket.py
          python hardware/interceptor/airframe.py
          python hardware/pcb/generate_board.py
          python hardware/drawings/generate_drawings.py
      - name: Drawings must be well-formed XML
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("hardware/*/out/*.svg"))
          assert files, "no drawings were generated"
          for f in files:
              ET.parse(f)
              print("ok", f)
          PY
      - name: Every expected fabrication output exists and is non-empty
        run: |
          # Deliberately not a byte-for-byte diff against the committed outputs:
          # the mesh booleans go through floating-point CSG, so results are not
          # bit-identical across platforms or library versions. What CI can
          # honestly assert is that every generator runs and emits a usable file.
          python - <<'PY'
          import os, sys
          expected = [
              "hardware/antennas/out/lpda_uhf.csv", "hardware/antennas/out/lpda_uhf.svg",
              "hardware/antennas/out/lpda_cellular.csv", "hardware/antennas/out/patch_array.csv",
              "hardware/mech/out/node_enclosure_base.stl", "hardware/mech/out/node_enclosure_lid.stl",
              "hardware/mech/out/mount_bracket.stl", "hardware/interceptor/out/talon_airframe.stl",
              "hardware/pcb/out/node_carrier.kicad_pcb", "hardware/pcb/out/node_carrier_outline.dxf",
              "hardware/drawings/out/PNMB-ENC-001_enclosure.svg",
              "hardware/drawings/out/PNMB-MNT-001_mount_bracket.svg",
              "hardware/drawings/out/PNMB-PCB-001_board_profile.svg",
          ]
          missing = [p for p in expected if not (os.path.exists(p) and os.path.getsize(p) > 0)]
          if missing:
              print("::error::missing or empty fabrication outputs: " + ", ".join(missing))
              sys.exit(1)
          print(f"all {len(expected)} fabrication outputs present")
          PY
      - name: Generated meshes must be watertight
        run: |
          python - <<'PY'
          import glob, sys, trimesh
          bad = []
          for f in sorted(glob.glob("hardware/*/out/*.stl")):
              m = trimesh.load(f)
              print(f, "watertight" if m.is_watertight else "NOT WATERTIGHT")
              if not m.is_watertight:
                  bad.append(f)
          if bad:
              print("::error::non-watertight mesh(es): " + ", ".join(bad))
              sys.exit(1)
          PY

  webapp:
    name: Webapp type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
